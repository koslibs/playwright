name: Release

on: workflow_dispatch

permissions:
    contents: write
    id-token: write

jobs:
    release:
        uses: koslibs/configs/.github/workflows/npm-release.yml@v2.0.0
        with:
            before-validation-command: node bin/playwright.js install --with-deps webkit
        secrets:
            npm_token: ${{ secrets.NPM_TOKEN }}
