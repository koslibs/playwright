name: Checks

on: [push, pull_request]

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24.13.0'
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run typecheck
            - run: node bin/playwright.js install --with-deps webkit
            - run: npm test
            - run: npm run lint
            - run: npm pack --dry-run
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: diagnostics-${{ matrix.os }}
                  path: |
                      test-results/
                      playwright-report/
